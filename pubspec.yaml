name: flymate
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter


  # Navigation & Network
  go_router: ^17.0.1
  dio: ^5.9.1

  # UI & Animation
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # State Management & Logic
  provider: ^6.1.5+1
  intl: ^0.20.2
  json_annotation: ^4.10.0

  # Payment & Auth
  razorpay_flutter: ^1.4.0
  google_sign_in: ^7.2.0
  firebase_auth: ^6.1.4
  firebase_core: ^4.4.0
  intl_phone_number_input: ^0.7.5
  flutter_localization: ^0.3.3
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.12.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/